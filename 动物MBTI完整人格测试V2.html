<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>动物MBTI完整人格测试 V2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236B8F71'/%3E%3Cpath d='M20 40c0-9 5-16 12-16s12 7 12 16c0 5-3 8-6 8h-12c-3 0-6-3-6-8z' fill='%23F5EFE4'/%3E%3Cpath d='M32 16l3 8h-6z' fill='%23F5EFE4'/%3E%3C/svg%3E">
<style>
:root{
  --pine:#2D4A3E;--moss:#6B8F71;--sand:#F5EFE4;--sand-deep:#EAE0CE;
  --coral:#E8795A;--ink:#22301F;--ink-soft:#5A6A55;--card:#FDFAF3;
  --radius:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(107,143,113,.16), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(232,121,90,.14), transparent 55%),
    var(--sand);
  color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 16px;line-height:1.6;
}
.app{
  width:100%;max-width:480px;background:var(--card);
  border:1px solid rgba(45,74,62,.08);border-radius:28px;
  box-shadow:0 20px 50px rgba(45,74,62,.10),0 2px 8px rgba(45,74,62,.05);
  padding:34px 26px 30px;position:relative;overflow:hidden;
}
.app::before{
  content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--coral),var(--moss) 55%,var(--pine));opacity:.85;
}
section{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[hidden]{display:none !important}

/* ===== Cover ===== */
.cover{text-align:center;padding-top:10px}
.cover .mark{
  width:118px;height:118px;margin:6px auto 22px;border-radius:50%;
  background:linear-gradient(145deg,#8FB08F,var(--moss));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 26px rgba(107,143,113,.32);
}
.cover .mark svg{width:58px;height:58px}
.cover h1{
  font-family:"Songti SC","Noto Serif SC","STSong",serif;
  font-size:34px;font-weight:700;letter-spacing:2px;color:var(--pine);
}
.cover .sub{margin-top:10px;color:var(--ink-soft);font-size:15px;letter-spacing:1px}
.cover .meta{
  margin:26px auto 0;display:inline-flex;gap:14px;
  background:var(--sand);border-radius:999px;padding:9px 18px;
  font-size:13px;color:var(--ink-soft);
}
.meta span{display:inline-flex;align-items:center;gap:5px}
.btn{
  display:block;width:100%;border:none;cursor:pointer;
  font-size:17px;font-weight:600;letter-spacing:2px;
  padding:15px 0;border-radius:999px;transition:transform .15s,box-shadow .15s;
}
.btn-primary{background:var(--pine);color:#FDFAF3;box-shadow:0 10px 22px rgba(45,74,62,.25)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(45,74,62,.32)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{
  background:transparent;color:var(--ink-soft);border:1px solid var(--sand-deep);
  font-size:15px;letter-spacing:1px;margin-top:14px;
}
.cover .start{margin-top:34px}
.cover .note{margin-top:16px;font-size:12px;color:var(--ink-soft);opacity:.8}

/* ===== Quiz ===== */
.quiz-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.q-count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.q-count b{color:var(--coral);font-size:16px}
.bar{flex:1;height:8px;background:var(--sand-deep);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--coral));transition:width .35s ease}
.dim-label{
  display:inline-block;font-size:13px;letter-spacing:2px;color:var(--moss);
  background:rgba(107,143,113,.12);border-radius:999px;padding:6px 16px;margin-bottom:18px;
}
.quiz h2{
  font-family:"Songti SC","Noto Serif SC","STSong",serif;
  font-size:23px;font-weight:700;line-height:1.5;color:var(--pine);
  margin-bottom:24px;min-height:66px;
}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  text-align:left;width:100%;border:1.5px solid var(--sand-deep);background:#fff;
  border-radius:16px;padding:16px 18px;font-size:15.5px;color:var(--ink);
  cursor:pointer;transition:border-color .15s,background .15s,transform .1s;
  font-family:inherit;line-height:1.5;
}
.opt:hover{border-color:var(--moss);transform:translateX(2px)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--coral);background:#FDF1EC;font-weight:600;color:#B5523A}
.quiz .next{margin-top:26px}

/* ===== Result ===== */
.result{text-align:center;padding-top:8px}
.result .label{
  display:inline-block;font-size:13px;letter-spacing:3px;color:var(--ink-soft);
  background:var(--sand);border-radius:999px;padding:7px 18px;margin-bottom:18px;
}
.typecode{
  font-family:"Songti SC","Noto Serif SC","STSong",serif;
  font-size:64px;font-weight:700;letter-spacing:10px;color:var(--coral);margin-bottom:8px;
}
.typecode span{display:inline-block}
.result .def{
  display:inline-block;font-size:15px;letter-spacing:2px;font-weight:600;
  color:#B5523A;background:#FDF1EC;border-radius:999px;padding:6px 18px;margin-bottom:18px;
}

/* Dimension cards with bars */
.dim-cards{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;text-align:left;
}
.dim-card{
  background:var(--sand);border-radius:18px;padding:14px 16px;
  display:flex;align-items:center;gap:10px;
}
.dim-card .dim-pic{
  width:50px;height:50px;border-radius:50%;object-fit:cover;
  border:3px solid #fff;box-shadow:0 4px 12px rgba(45,74,62,.18);flex-shrink:0;
}
.dim-card .dim-info{flex:1;min-width:0}
.dim-card .dim-letter{
  font-size:20px;font-weight:700;color:var(--pine);letter-spacing:2px;line-height:1.2;
}
.dim-card .dim-name{font-size:12px;color:var(--ink-soft);margin-top:2px}

/* Intensity bar */
.intensity-wrap{margin-top:6px}
.intensity-label{font-size:11px;color:var(--moss);font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between}
.intensity-bar{height:6px;background:var(--sand-deep);border-radius:99px;overflow:hidden;position:relative}
.intensity-bar .fill{height:100%;border-radius:99px;transition:width .6s ease}
.fill-e{background:linear-gradient(90deg,#E8795A,#F4A259)}
.fill-i{background:linear-gradient(90deg,#6B8F71,#2D4A3E)}
.fill-t{background:linear-gradient(90deg,#E8795A,#F4A259)}
.fill-f{background:linear-gradient(90deg,#6B8F71,#2D4A3E)}
.fill-s{background:linear-gradient(90deg,#E8795A,#F4A259)}
.fill-n{background:linear-gradient(90deg,#6B8F71,#2D4A3E)}
.fill-j{background:linear-gradient(90deg,#E8795A,#F4A259)}
.fill-p{background:linear-gradient(90deg,#6B8F71,#2D4A3E)}

.dom-animal{
  font-size:14px;color:var(--pine);font-weight:600;
  background:#EDF2EA;border:1px solid #D8E4D3;border-radius:999px;padding:8px 18px;
  display:inline-block;margin-bottom:18px;letter-spacing:1px;
}
.tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tags span{
  font-size:13px;color:var(--pine);background:#EDF2EA;border:1px solid #D8E4D3;
  border-radius:999px;padding:5px 14px;letter-spacing:1px;
}

/* Rich profile sections */
.profile-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;text-align:left;
}
.profile-card{
  background:var(--sand);border-radius:16px;padding:14px 16px;
}
.profile-card.full{grid-column:1/-1}
.profile-card h4{
  font-size:12px;color:var(--moss);letter-spacing:2px;font-weight:600;
  margin-bottom:8px;text-transform:uppercase;
}
.profile-card p{font-size:14px;color:var(--ink);line-height:1.7}
.profile-card ul{list-style:none;padding:0;font-size:14px;color:var(--ink);line-height:1.8}
.profile-card ul li::before{content:"✦ ";color:var(--moss);font-size:10px}

.result .warn{
  font-size:14px;color:var(--pine);font-weight:600;
  background:rgba(45,74,62,.08);border-radius:14px;padding:13px 16px;margin-bottom:14px;
  line-height:1.7;text-align:left;
}
.result .quote{
  font-size:14px;color:var(--coral);font-style:normal;font-weight:600;
  background:#FDF1EC;border-radius:14px;padding:13px 16px;margin-bottom:24px;line-height:1.7;
}

/* History panel */
.history-panel{
  margin-top:20px;border-top:1px solid var(--sand-deep);padding-top:18px;
}
.history-panel h3{
  font-size:14px;color:var(--pine);letter-spacing:2px;margin-bottom:12px;font-weight:600;
}
.history-item{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--sand);border-radius:12px;padding:10px 14px;margin-bottom:8px;
  cursor:pointer;transition:background .15s;
}
.history-item:hover{background:var(--sand-deep)}
.history-item .hi-code{font-size:18px;font-weight:700;color:var(--coral);letter-spacing:3px}
.history-item .hi-name{font-size:13px;color:var(--ink-soft)}
.history-item .hi-time{font-size:11px;color:var(--ink-soft)}
.btn-clear{
  font-size:12px;color:var(--ink-soft);background:none;border:none;cursor:pointer;
  text-decoration:underline;margin-top:8px;
}

.result .share{
  font-size:12.5px;color:var(--ink-soft);margin-top:14px;letter-spacing:1px;
}
.result .share b{color:var(--moss);font-weight:600}

/* Share card overlay */
.share-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(34,48,31,.85);
  display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;
}
.share-card{
  background:var(--card);border-radius:28px;max-width:400px;width:100%;
  padding:36px 28px;text-align:center;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.share-card .sc-typecode{
  font-family:"Songti SC","Noto Serif SC","STSong",serif;
  font-size:56px;font-weight:700;letter-spacing:8px;color:var(--coral);margin-bottom:6px;
}
.share-card .sc-def{
  font-size:18px;font-weight:600;color:var(--pine);margin-bottom:16px;
}
.share-card .sc-desc{
  font-size:14px;color:var(--ink);line-height:1.8;margin-bottom:20px;
  background:var(--sand);border-radius:14px;padding:14px 16px;
}
.share-card .sc-animal{font-size:40px;margin-bottom:8px}
.share-card .sc-animal-name{font-size:15px;color:var(--moss);font-weight:600;margin-bottom:20px}
.share-card .sc-tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.share-card .sc-tags span{
  font-size:12px;color:var(--pine);background:#EDF2EA;border:1px solid #D8E4D3;
  border-radius:999px;padding:4px 12px;
}
.share-card .sc-footer{
  font-size:11px;color:var(--ink-soft);letter-spacing:1px;
}
.btn-close-share{
  position:absolute;top:14px;right:14px;background:none;border:none;
  cursor:pointer;font-size:20px;color:var(--ink-soft);line-height:1;
}

@media (max-width:380px){
  .app{padding:28px 18px 24px}
  .cover h1{font-size:29px}
  .quiz h2{font-size:20px}
  .typecode{font-size:52px;letter-spacing:6px}
  .profile-grid{grid-template-columns:1fr}
  .profile-card.full{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<main class="app">

  <!-- ===== 封面 ===== -->
  <section id="view-cover" class="cover">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M20 40c0-9 5-16 12-16s12 7 12 16c0 5-3 8-6 8H26c-3 0-6-3-6-8z" fill="#F5EFE4"/>
        <path d="M28 22h8v6h-8z" fill="#F5EFE4"/>
        <path d="M30 24c0-3 2-5 2-5s2 2 2 5" stroke="#E8795A" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>动物MBTI完整人格</h1>
    <p class="sub">4 个维度，32 个问题，认识完整的你</p>
    <div class="meta">
      <span>约 5 分钟</span>
      <span>·</span>
      <span>16 种人格 · 6 种动物</span>
    </div>
    <button class="btn btn-primary start" id="btn-start">开始测试</button>
    <button class="btn btn-ghost" id="btn-history" hidden>查看历史结果</button>
    <p class="note">结果仅供娱乐，每个人都是独一无二的动物</p>
  </section>

  <!-- ===== 答题 ===== -->
  <section id="view-quiz" class="quiz" hidden>
    <div class="quiz-head">
      <span class="q-count"><b id="q-cur">1</b> / <span id="q-total">32</span></span>
      <div class="bar"><i id="q-bar"></i></div>
    </div>
    <div class="dim-label" id="dim-label">第 1/4 部分 · 能量来源</div>
    <h2 id="q-text"></h2>
    <div class="opts" id="q-opts"></div>
    <button class="btn btn-primary next" id="btn-next" hidden>下一题</button>
  </section>

  <!-- ===== 结果 ===== -->
  <section id="view-result" class="result" hidden>
    <span class="label">你的完整人格是</span>
    <div class="typecode" id="r-typecode"></div>
    <div class="dim-cards" id="r-dim-cards"></div>
    <div id="r-dominant" class="dom-animal" hidden></div>
    <div class="def" id="r-def"></div>
    <div class="tags" id="r-tags"></div>

    <div class="profile-grid" id="r-profile"></div>

    <p class="warn" id="r-warn" hidden></p>
    <p class="quote" id="r-quote"></p>

    <button class="btn btn-primary" id="btn-share">生成分享卡片</button>
    <button class="btn btn-ghost" id="btn-retry">再测一次</button>
    <a class="btn btn-ghost" href="index.html" style="text-decoration:none;text-align:center">看看其他动物测试 →</a>

    <div class="history-panel" id="history-panel">
      <h3>📋 历史结果</h3>
      <div id="history-list"></div>
      <button class="btn-clear" id="btn-clear-history" hidden>清空历史</button>
    </div>
    <p class="share">截图分享你的动物人格，看看你是哪种动物系的人？<br><b>长按图片可保存</b></p>
  </section>

</main>

<!-- Share overlay -->
<div class="share-overlay" id="share-overlay" hidden>
  <div class="share-card" id="share-card">
    <button class="btn-close-share" id="btn-close-share">×</button>
    <div class="sc-animal" id="sc-animal"></div>
    <div class="sc-typecode" id="sc-typecode"></div>
    <div class="sc-def" id="sc-def"></div>
    <div class="sc-desc" id="sc-desc"></div>
    <div class="sc-tags" id="sc-tags"></div>
    <div class="sc-animal-name" id="sc-animal-name"></div>
    <div class="sc-footer">动物MBTI完整人格测试 V2 · 测出你的动物人格</div>
  </div>
</div>

  /* ===== 视图切换 ===== */
  var $ = function(id){ return document.getElementById(id); };
  var views = {cover:$("view-cover"), quiz:$("view-quiz"), result:$("view-result")};
  function show(v){
    Object.keys(views).forEach(function(k){ views[k].hidden = (k !== v); });
  }

  /* ===== 答题状态 ===== */
  var cur = 0;
  var scores = {};
  var selected = null;

  function reset(){
    cur = 0; selected = null;
    scores = {i:0,e:0,t:0,f:0,s:0,n:0,j:0,p:0};
  }

  /* ===== 渲染题目 ===== */
  function renderQuestion(){
    var item = QUESTIONS[cur];
    var dim = DIMS[item.d];
    $("q-cur").textContent = cur + 1;
    $("q-total").textContent = QUESTIONS.length;
    $("q-bar").style.width = (cur / QUESTIONS.length * 100) + "%";
    $("dim-label").textContent = "第 " + (item.d + 1) + "/4 部分 · " + dim.name;
    $("q-text").textContent = item.q;
    var box = $("q-opts");
    box.innerHTML = "";
    selected = null;
    $("btn-next").hidden = true;
    item.opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = o.t;
      b.addEventListener("click", function(){
        scores[o.a] += 1;
        selected = o.a;
        var all = box.children;
        for (var j = 0; j < all.length; j++) all[j].classList.remove("sel");
        b.classList.add("sel");
        $("btn-next").hidden = false;
      });
      box.appendChild(b);
    });
  }

  function next(){
    if (selected === null) return;
    cur += 1;
    if (cur < QUESTIONS.length){
      renderQuestion();
    } else {
      showResult();
    }
  }

  /* ===== 计算结果 ===== */
  function getResultLetter(pole){
    var dim = DIMS.find(function(d){ return d.key === pole; });
    var pts = dim.poles;
    if (scores[pts[0]] >= scores[pts[1]]) return pts[0].toUpperCase();
    return pts[1].toUpperCase();
  }

  function getPercentage(pole){
    var dim = DIMS.find(function(d){ return d.key === pole; });
    var pts = dim.poles;
    var total = scores[pts[0]] + scores[pts[1]];
    if (total === 0) return 50;
    var win = scores[pts[0]] >= scores[pts[1]] ? pts[0] : pts[1];
    return Math.round(scores[win] / total * 100);
  }

  function showResult(){
    var letters = ["e","t","s","j"].map(getResultLetter);
    var code = letters.join("");
    var profile = PROFILES[code];

    // 类型码
    var tc = $("r-typecode");
    tc.innerHTML = "";
    code.split("").forEach(function(ch){
      var s = document.createElement("span");
      s.textContent = ch;
      tc.appendChild(s);
    });

    // 四维卡片 + 百分比 + 能量条
    var dimCards = $("r-dim-cards");
    dimCards.innerHTML = "";
    var poleKeys = ["e","t","s","j"];
    poleKeys.forEach(function(k, idx){
      var dim = DIMS[idx];
      var pts = dim.poles;
      var win = scores[pts[0]] >= scores[pts[1]] ? pts[0] : pts[1];
      var anim = ANIMAL_MAP[win];
      var pct = getPercentage(k);
      var otherPct = 100 - pct;

      var card = document.createElement("div");
      card.className = "dim-card";
      var loser = pts[0] === win ? pts[1] : pts[0];
      card.innerHTML =
        '<img class="dim-pic" src="' + IMGS[anim.id] + '" alt="' + anim.name + '">' +
        '<div class="dim-info">' +
          '<div class="dim-letter">' + win.toUpperCase() + '</div>' +
          '<div class="dim-name">' + dim.name + '</div>' +
          '<div class="intensity-wrap">' +
            '<div class="intensity-label">' +
              '<span>' + loser.toUpperCase() + ' ' + otherPct + '%</span>' +
              '<span>' + win.toUpperCase() + ' ' + pct + '%</span>' +
            '</div>' +
            '<div class="intensity-bar">' +
              '<div class="fill fill-' + win + '" style="width:' + pct + '%"></div>' +
            '</div>' +
          '</div>' +
        '</div>';
      dimCards.appendChild(card);
    });

    // 主导动物
    var animalCounts = {};
    poleKeys.forEach(function(k){
      var dim = DIMS.find(function(d){ return d.key === k; });
      var pts = dim.poles;
      var win = scores[pts[0]] >= scores[pts[1]] ? pts[0] : pts[1];
      var animId = ANIMAL_MAP[win].id;
      animalCounts[animId] = (animalCounts[animId] || 0) + 1;
    });
    var domEl = $("r-dominant");
    var domAnimal = null;
    Object.keys(animalCounts).forEach(function(aid){
      if (animalCounts[aid] >= 2 && (!domAnimal || animalCounts[aid] > (animalCounts[domAnimal]||0))){
        domAnimal = aid;
      }
    });
    if (domAnimal){
      var domName = "";

        if (ANIMAL_MAP[k].id === domAnimal) domName = ANIMAL_MAP[k].name;
      });
      domEl.textContent = "你的主导动物：" + domName;
      domEl.hidden = false;
    } else {
      domEl.hidden = true;

    // 画像

      s.textContent = t;
      tags.appendChild(s);
    });

    // 丰富画像卡片

    pg.innerHTML = "";
    var sections = [
      {title:"性格核心", content:profile.core, full:true},
      {title:"优势", content:profile.adv, list:true},
      {title:"盲点", content:profile.blind, list:true},
      {title:"适合职业", content:profile.careers, list:true},
      {title:"恋爱模式", content:profile.love, full:true},
      {title:"人际相处", content:profile.social, full:true},
      {title:"成长建议", content:profile.growth, full:true},
      {title:"动物图腾", content:profile.animal, full:true},
    ];
    sections.forEach(function(sec){
      var card = document.createElement("div");
      card.className = "profile-card" + (sec.full ? " full" : "");
      var html = '<h4>' + sec.title + '</h4>';
      if (sec.list){
        html += '<ul>' + sec.content.map(function(item){ return '<li>' + item + '</li>'; }).join('') + '</ul>';
      } else {
        html += '<p>' + sec.content + '</p>';
      }
      card.innerHTML = html;
      pg.appendChild(card);
    });

    var warnEl = $("r-warn");
    warnEl.textContent = "注意：" + profile.warn;
    warnEl.hidden = false;
    $("r-quote").textContent = "「 " + profile.quote + " 」";

    show("result");
    saveHistory(code, profile);
    $("btn-history").hidden = false;
    renderHistory();
  }

  /* ===== 分享卡片 ===== */
  function openShare(){
    var letters = ["e","t","s","j"].map(getResultLetter);
    var code = letters.join("");
    var profile = PROFILES[code];
    var poles = ["e","t","s","j"];
    var animals = poles.map(function(k){
      var dim = DIMS.find(function(d){ return d.key === k; });
      var pts = dim.poles;
      var win = scores[pts[0]] >= scores[pts[1]] ? pts[0] : pts[1];
      return ANIMAL_MAP[win];
    });
    var animalEmojis = animals.map(function(a){ return a.emoji; }).join(" ");

    $("sc-animal").textContent = animalEmojis;
    $("sc-typecode").textContent = code.toUpperCase();
    $("sc-def").textContent = profile.name;
    $("sc-desc").textContent = profile.core;
    var stags = $("sc-tags");
    stags.innerHTML = "";
    profile.tags.forEach(function(t){
      var s = document.createElement("span");
      s.textContent = t;
      stags.appendChild(s);
    });
    $("sc-animal-name").textContent = profile.animal;
    $("share-overlay").hidden = false;
  }

  $("btn-share").addEventListener("click", openShare);
  $("btn-close-share").addEventListener("click", function(){ $("share-overlay").hidden = true; });
  $("share-overlay").addEventListener("click", function(e){
    if (e.target === $("share-overlay")) $("share-overlay").hidden = true;
  });

  /* ===== 历史记录 (localStorage) ===== */
  var STORAGE_KEY = "mbti_v2_history";
  function getHistory(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch(e){ return []; }
  }

  function showSavedResult(item){
    var code = (item.code || "").toUpperCase();
    var profile = PROFILES[code];
    if (!profile) { alert("历史记录数据异常，请清空后重试"); return; }
    // 类型码
    var tc = $("r-typecode");
    tc.innerHTML = "";
    item.code.toUpperCase().split("").forEach(function(ch){
      var s = document.createElement("span");
      s.textContent = ch;
      tc.appendChild(s);
    });
    // 四维卡片（用存档占比还原）
    var dimCards = $("r-dim-cards");
    dimCards.innerHTML = "";
    if (item.dims){
      ["e","t","s","j"].forEach(function(k){
        var d = item.dims[k];
        if (!d) return;
        var dim = DIMS.find(function(x){ return x.key === k; });
        var anim = ANIMAL_MAP[d.win];
        var card = document.createElement("div");
        card.className = "dim-card";
        card.innerHTML =
          '<img class="dim-pic" src="' + IMGS[anim.id] + '" alt="' + anim.name + '">' +
          '<div class="dim-info">' +
            '<div class="dim-letter">' + d.win.toUpperCase() + '</div>' +
            '<div class="dim-name">' + dim.name + '</div>' +
            '<div class="intensity-wrap">' +
              '<div class="intensity-label">' +
                '<span>' + d.loser.toUpperCase() + ' ' + (100 - d.pct) + '%</span>' +
                '<span>' + d.win.toUpperCase() + ' ' + d.pct + '%</span>' +
              '</div>' +
              '<div class="intensity-bar">' +
                '<div class="fill fill-' + d.win + '" style="width:' + d.pct + '%"></div>' +
              '</div>' +
            '</div>' +
          '</div>';
        dimCards.appendChild(card);
      });
    } else {
      dimCards.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);grid-column:1/-1">该条历史为旧版本记录，仅展示人格画像</p>';
    }
    // 主导动物
    var domEl = $("r-dominant");
    var animalCounts = {};
    if (item.dims){
      ["e","t","s","j"].forEach(function(k){
        var d = item.dims[k];
        if (d) animalCounts[ANIMAL_MAP[d.win].id] = (animalCounts[ANIMAL_MAP[d.win].id] || 0) + 1;
      });
    } else {
      var pc = (item.code || "").toUpperCase();
      ["e","t","s","j"].forEach(function(k){
        var idx = ["e","t","s","j"].indexOf(k);
        var win = pc[idx];
        if (win && ANIMAL_MAP[win]) animalCounts[ANIMAL_MAP[win].id] = (animalCounts[ANIMAL_MAP[win].id] || 0) + 1;
      });
    }
    var domAnimal = null;
    Object.keys(animalCounts).forEach(function(aid){
      if (animalCounts[aid] >= 2 && (!domAnimal || animalCounts[aid] > (animalCounts[domAnimal]||0))){
        domAnimal = aid;
      }
    });
    if (domAnimal){
      var domName = "";
      Object.keys(ANIMAL_MAP).forEach(function(k){
        if (ANIMAL_MAP[k].id === domAnimal) domName = ANIMAL_MAP[k].name;
      });
      domEl.textContent = "你的主导动物：" + domName;
      domEl.hidden = false;
    } else {
      domEl.hidden = true;
    }
    // 画像
    $("r-def").textContent = profile.name;
    var tags = $("r-tags");
    tags.innerHTML = "";
    profile.tags.forEach(function(t){
      var s = document.createElement("span");
      s.textContent = t;
      tags.appendChild(s);
    });
    // 画像卡片
    var pg = $("r-profile");
    pg.innerHTML = "";
    var sections = [
      {title:"性格核心", content:profile.core, full:true},
      {title:"优势", content:profile.adv, list:true},
      {title:"盲点", content:profile.blind, list:true},
      {title:"适合职业", content:profile.careers, list:true},
      {title:"恋爱模式", content:profile.love, full:true},
      {title:"人际相处", content:profile.social, full:true},
      {title:"成长建议", content:profile.growth, full:true},
      {title:"动物图腾", content:profile.animal, full:true},
    ];
    sections.forEach(function(sec){
      var card = document.createElement("div");
      card.className = "profile-card" + (sec.full ? " full" : "");
      var html = '<h4>' + sec.title + '</h4>';
      if (sec.list){
        html += '<ul>' + sec.content.map(function(item){ return '<li>' + item + '</li>'; }).join('') + '</ul>';
      } else {
        html += '<p>' + sec.content + '</p>';
      }
      card.innerHTML = html;
      pg.appendChild(card);
    });
    var warnEl = $("r-warn");
    warnEl.textContent = "注意：" + profile.warn;
    warnEl.hidden = false;
    $("r-quote").textContent = "「 " + profile.quote + " 」";
    show("result");
  }

  function saveHistory(code, profile){
    var h = getHistory();
    var now = new Date();
    var timeStr = now.getFullYear() + "-" +
      String(now.getMonth()+1).padStart(2,"0") + "-" +
      String(now.getDate()).padStart(2,"0") + " " +
      String(now.getHours()).padStart(2,"0") + ":" +
      String(now.getMinutes()).padStart(2,"0");
    var dims = {};
    ["e","t","s","j"].forEach(function(k){
      var dim = DIMS.find(function(d){ return d.key === k; });
      var pts = dim.poles;
      var win = scores[pts[0]] >= scores[pts[1]] ? pts[0] : pts[1];
      var total = scores[pts[0]] + scores[pts[1]];
      var pct = total === 0 ? 50 : Math.round(scores[win] / total * 100);
      dims[k] = {win: win, loser: pts[0] === win ? pts[1] : pts[0], pct: pct};
    });
    h.unshift({code:code.toUpperCase(), name:profile.name, time:timeStr, dims:dims});
    if (h.length > 10) h = h.slice(0,10);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
  }
  function renderHistory(){
    var h = getHistory();
    var list = $("history-list");
    list.innerHTML = "";
    if (h.length > 1){
      $("btn-clear-history").hidden = false;
      h.slice(1).forEach(function(item){
        var div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML =
          '<div><span class="hi-code">' + item.code + '</span> <span class="hi-name">' + item.name + '</span></div>' +
          '<span class="hi-time">' + item.time + '</span>';
        div.addEventListener("click", function(){
          showSavedResult(item);
        });
        list.appendChild(div);
      });
    } else {
      $("btn-clear-history").hidden = true;
      list.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">暂无历史结果</p>';
    }
  }
  $("btn-clear-history").addEventListener("click", function(){
    if (confirm("确定清空历史结果？")){
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    }
  });

  /* ===== 事件绑定 ===== */
  $("btn-start").addEventListener("click", function(){
    reset();
    renderQuestion();
    show("quiz");
  });
  $("btn-next").addEventListener("click", next);
  $("btn-retry").addEventListener("click", function(){
    reset();
    renderQuestion();
    show("quiz");
  });

  /* Check history on cover */
  var h = getHistory();
  if (h.length > 0) $("btn-history").hidden = false;
  $("btn-history").addEventListener("click", function(){
    var hh = getHistory();
    if (hh.length > 0){
      showSavedResult(hh[0]);
    }
  });

})();
</script>
</body>
</html>
