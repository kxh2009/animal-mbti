<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>测出你的完整人格</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236B8F71'/%3E%3Cpath d='M20 40c0-9 5-16 12-16s12 7 12 16c0 5-3 8-6 8h-12c-3 0-6-3-6-8z' fill='%23F5EFE4'/%3E%3Cpath d='M32 16l3 8h-6z' fill='%23F5EFE4'/%3E%3C/svg%3E">
<style>
  :root{
    --pine:#2D4A3E;
    --moss:#6B8F71;
    --sand:#F5EFE4;
    --sand-deep:#EAE0CE;
    --coral:#E8795A;
    --ink:#22301F;
    --ink-soft:#5A6A55;
    --card:#FDFAF3;
    --radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(107,143,113,.16), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(232,121,90,.14), transparent 55%),
      var(--sand);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    line-height:1.6;
  }
  .app{
    width:100%;
    max-width:460px;
    background:var(--card);
    border:1px solid rgba(45,74,62,.08);
    border-radius:28px;
    box-shadow:0 20px 50px rgba(45,74,62,.10), 0 2px 8px rgba(45,74,62,.05);
    padding:34px 26px 30px;
    position:relative;
    overflow:hidden;
  }
  .app::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,var(--coral),var(--moss) 55%,var(--pine));
    opacity:.85;
  }
  section{animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  [hidden]{display:none !important}

  /* ===== 封面 ===== */
  .cover{text-align:center;padding-top:10px}
  .cover .mark{
    width:118px;height:118px;margin:6px auto 22px;border-radius:50%;
    background:linear-gradient(145deg,#8FB08F,var(--moss));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 26px rgba(107,143,113,.32);
  }
  .cover .mark svg{width:58px;height:58px}
  .cover h1{
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    font-size:34px;font-weight:700;letter-spacing:2px;color:var(--pine);
  }
  .cover .sub{
    margin-top:10px;color:var(--ink-soft);font-size:15px;letter-spacing:1px;
  }
  .cover .meta{
    margin:26px auto 0;display:inline-flex;gap:14px;
    background:var(--sand);border-radius:999px;padding:9px 18px;
    font-size:13px;color:var(--ink-soft);
  }
  .meta span{display:inline-flex;align-items:center;gap:5px}
  .btn{
    display:block;width:100%;border:none;cursor:pointer;
    font-size:17px;font-weight:600;letter-spacing:2px;
    padding:15px 0;border-radius:999px;transition:transform .15s,box-shadow .15s;
  }
  .btn-primary{background:var(--pine);color:#FDFAF3;box-shadow:0 10px 22px rgba(45,74,62,.25)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(45,74,62,.32)}
  .btn-primary:active{transform:translateY(0)}
  .btn-ghost{
    background:transparent;color:var(--ink-soft);border:1px solid var(--sand-deep);
    font-size:15px;letter-spacing:1px;margin-top:14px;
  }
  .cover .start{margin-top:34px}
  .cover .note{margin-top:16px;font-size:12px;color:var(--ink-soft);opacity:.8}

  /* ===== 答题 ===== */
  .quiz-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .q-count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .q-count b{color:var(--coral);font-size:16px}
  .bar{flex:1;height:8px;background:var(--sand-deep);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--coral));transition:width .35s ease}
  .dim-label{
    display:inline-block;font-size:13px;letter-spacing:2px;color:var(--moss);
    background:rgba(107,143,113,.12);border-radius:999px;padding:6px 16px;
    margin-bottom:18px;
  }
  .quiz h2{
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    font-size:23px;font-weight:700;line-height:1.5;color:var(--pine);
    margin-bottom:24px;min-height:66px;
  }
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{
    text-align:left;width:100%;border:1.5px solid var(--sand-deep);background:#fff;
    border-radius:16px;padding:16px 18px;font-size:15.5px;color:var(--ink);
    cursor:pointer;transition:border-color .15s,background .15s,transform .1s;
    font-family:inherit;line-height:1.5;
  }
  .opt:hover{border-color:var(--moss);transform:translateX(2px)}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--coral);background:#FDF1EC;font-weight:600;color:#B5523A}
  .quiz .next{margin-top:26px}

  /* ===== 结果 ===== */
  .result{text-align:center;padding-top:8px}
  .result .label{
    display:inline-block;font-size:13px;letter-spacing:3px;color:var(--ink-soft);
    background:var(--sand);border-radius:999px;padding:7px 18px;margin-bottom:18px;
  }
  .typecode{
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    font-size:64px;font-weight:700;letter-spacing:10px;color:var(--coral);
    margin-bottom:8px;
  }
  .typecode span{
    display:inline-block;
  }
  .result .def{
    display:inline-block;font-size:15px;letter-spacing:2px;font-weight:600;
    color:#B5523A;background:#FDF1EC;border-radius:999px;padding:6px 18px;margin-bottom:20px;
  }
  .dim-cards{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
    margin-bottom:22px;text-align:left;
  }
  .dim-card{
    background:var(--sand);border-radius:18px;padding:14px 16px;
    display:flex;align-items:center;gap:12px;
  }
  .dim-card .dim-pic{
    width:56px;height:56px;border-radius:50%;object-fit:cover;
    border:3px solid #fff;box-shadow:0 4px 12px rgba(45,74,62,.18);
    flex-shrink:0;opacity:1;
  }
  .dim-card .dim-info{flex:1;min-width:0}
  .dim-card .dim-letter{
    font-size:22px;font-weight:700;color:var(--pine);letter-spacing:2px;
    line-height:1.2;
  }
  .dim-card .dim-name{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .dim-card .dim-animal{
    font-size:12px;color:var(--moss);margin-top:2px;font-weight:600;
  }
  .dom-animal{
    font-size:14px;color:var(--pine);font-weight:600;
    background:#EDF2EA;border:1px solid #D8E4D3;
    border-radius:999px;padding:8px 18px;display:inline-block;
    margin-bottom:18px;letter-spacing:1px;
  }
  .tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .tags span{
    font-size:13px;color:var(--pine);background:#EDF2EA;border:1px solid #D8E4D3;
    border-radius:999px;padding:5px 14px;letter-spacing:1px;
  }
  .result .desc{
    font-size:15px;color:var(--ink);line-height:1.9;text-align:left;
    background:var(--sand);border-radius:18px;padding:18px 20px;margin-bottom:14px;
  }
  .result .warn{
    font-size:14px;color:var(--pine);font-weight:600;
    background:rgba(45,74,62,.08);border-radius:14px;
    padding:13px 16px;margin-bottom:14px;line-height:1.7;text-align:left;
  }
  .result .quote{
    font-size:14px;color:var(--coral);font-style:normal;font-weight:600;
    background:#FDF1EC;border-radius:14px;padding:13px 16px;margin-bottom:24px;line-height:1.7;
  }
  .result .share{
    font-size:12.5px;color:var(--ink-soft);margin-top:14px;letter-spacing:1px;
  }
  .result .share b{color:var(--moss);font-weight:600}

  @media (max-width:380px){
    .app{padding:28px 18px 24px}
    .cover h1{font-size:29px}
    .quiz h2{font-size:20px}
    .typecode{font-size:52px;letter-spacing:6px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<main class="app">

  <!-- ===== 视图：封面 ===== -->
  <section id="view-cover" class="cover">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M20 40c0-9 5-16 12-16s12 7 12 16c0 5-3 8-6 8H26c-3 0-6-3-6-8z" fill="#F5EFE4"/>
        <path d="M28 22h8v6h-8z" fill="#F5EFE4"/>

    <div id="r-dominant" class="dom-animal" hidden></div>

    <div class="tags" id="r-tags"></div>

    <button class="btn btn-primary" id="btn-retry">再测一次</button>
    <p class="share">截图你的完整人格，看看你是哪种动物系的人？<br><b>长按图片可保存</b></p>
  </section>

</main>

  /* ===== 视图切换 ===== */
  var $ = function(id){ return document.getElementById(id); };
  var views = { cover:$("view-cover"), quiz:$("view-quiz"), result:$("view-result") };
  function show(v){
    Object.keys(views).forEach(function(k){ views[k].hidden = (k !== v); });
  }

  /* ===== 答题状态 ===== */
  var cur = 0;
  var scores = {};       // { i:0, e:0, t:0, f:0, s:0, n:0, j:0, p:0 }
  var selected = null;

  function reset(){
    cur = 0; selected = null;
    scores = { i:0, e:0, t:0, f:0, s:0, n:0, j:0, p:0 };
  }

  function renderQuestion(){
    var item = QUESTIONS[cur];
    var dim = DIMS[item.d];
    $("q-cur").textContent = cur + 1;
    $("q-total").textContent = QUESTIONS.length;
    $("q-bar").style.width = (cur / QUESTIONS.length * 100) + "%";
    $("dim-label").textContent = "第 " + (item.d + 1) + "/4 部分 · " + dim.name;
    $("q-text").textContent = "题" + (cur % 6 + 1) + "：" + item.q;
    var box = $("q-opts");
    box.innerHTML = "";
    selected = null;
    $("btn-next").hidden = true;
    item.opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = o.t;
      b.addEventListener("click", function(){
        scores[o.a] += 1;
        selected = o.a;
        var all = box.children;
        for (var j = 0; j < all.length; j++){ all[j].classList.remove("sel"); }
        b.classList.add("sel");
        $("btn-next").hidden = false;
      });
      box.appendChild(b);
    });
  }

  function next(){
    if (selected === null) return;
    cur += 1;
    if (cur < QUESTIONS.length){
      renderQuestion();
    } else {
      showResult();
    }
  }

  function getResultLetter(pole){
    // pole is the key in DIMS (e/t/s/j), returns upper case letter
    var pts = DIMS.find(function(d){ return d.key === pole; }).pts;
    var sc = scores;
    if (sc[pts[0]] >= sc[pts[1]]) return pts[0].toUpperCase();
    return pts[1].toUpperCase();
  }

  function showResult(){
    var letters = ["e","t","s","j"].map(getResultLetter);
    var code = letters.join("");
    var profile = PROFILES[code];

    // 类型码
    var tc = $("r-typecode");
    tc.innerHTML = "";
    code.split("").forEach(function(ch){
      var s = document.createElement("span");
      s.textContent = ch;
      tc.appendChild(s);
    });

    // 四维卡片
    var dimResults = ["e","t","s","j"];
    dimResults.forEach(function(k, idx){
      var pts = DIMS[idx].pts;
      var sc = scores;
      var win;
      if (sc[pts[0]] >= sc[pts[1]]) win = pts[0];
      else win = pts[1];
      var anim = ANIMAL_MAP[win];
      $("letter-" + k).textContent = win.toUpperCase();
      $("animal-" + k).textContent = anim.name + " · " + anim.desc;
      var img = $("pic-" + k);
      img.src = "assets/animal-" + anim.id + ".jpg";
      img.alt = anim.name + "人格形象";
      img.hidden = false;
    });

    // 主导动物
    var animalCounts = {};
    ["e","t","s","j"].forEach(function(k){
      var pts = DIMS[DIMS.map(function(d){return d.key}).indexOf(k)].pts;
      var sc = scores;
      var win = (sc[pts[0]] >= sc[pts[1]]) ? pts[0] : pts[1];
      var animId = ANIMAL_MAP[win].id;
      animalCounts[animId] = (animalCounts[animId] || 0) + 1;
    });
    var domEl = $("r-dominant");
    var domAnimal = null;
    Object.keys(animalCounts).forEach(function(aid){
      if (animalCounts[aid] >= 2 && (!domAnimal || animalCounts[aid] > (animalCounts[domAnimal]||0))){
        domAnimal = aid;
      }
    });
    if (domAnimal){
      var domInfo = ANIMAL_MAP;
      // find the pole that maps to this animal
      var domName = "";
      Object.keys(ANIMAL_MAP).forEach(function(k){
        if (ANIMAL_MAP[k].id === domAnimal) domName = ANIMAL_MAP[k].name;
      });
      domEl.textContent = "你的主导动物：" + domName;
      domEl.hidden = false;
    } else {
      domEl.hidden = true;
    }

    // 画像
    $("r-def").textContent = profile.name;
    var tags = $("r-tags");
    tags.innerHTML = "";
    profile.tags.forEach(function(t){
      var s = document.createElement("span");
      s.textContent = t;
      tags.appendChild(s);
    });
    $("r-desc").textContent = profile.desc;
    var warnEl = $("r-warn");
    warnEl.textContent = "注意：" + profile.warn;
    warnEl.hidden = false;
    $("r-quote").textContent = "「 " + profile.quote + " 」";

    show("result");
  }

  /* ===== 事件绑定 ===== */
  $("btn-start").addEventListener("click", function(){
    reset();
    renderQuestion();
    show("quiz");
  });
  $("btn-next").addEventListener("click", next);
  $("btn-retry").addEventListener("click", function(){
    reset();
    renderQuestion();
    show("quiz");
  });
})();
</script>
