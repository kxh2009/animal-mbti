<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>你在朋友里是哪只动物？</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236B8F71'/%3E%3Cpath d='M20 40c0-9 5-16 12-16s12 7 12 16c0 5-3 8-6 8h-12c-3 0-6-3-6-8z' fill='%23F5EFE4'/%3E%3Cpath d='M32 16l3 8h-6z' fill='%23F5EFE4'/%3E%3C/svg%3E">
<style>
  :root{
    --pine:#2D4A3E;
    --moss:#6B8F71;
    --sand:#F5EFE4;
    --sand-deep:#EAE0CE;
    --coral:#E8795A;
    --ink:#22301F;
    --ink-soft:#5A6A55;
    --card:#FDFAF3;
    --radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(107,143,113,.16), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(232,121,90,.14), transparent 55%),
      var(--sand);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    line-height:1.6;
  }
  .app{
    width:100%;
    max-width:460px;
    background:var(--card);
    border:1px solid rgba(45,74,62,.08);
    border-radius:28px;
    box-shadow:0 20px 50px rgba(45,74,62,.10), 0 2px 8px rgba(45,74,62,.05);
    padding:34px 26px 30px;
    position:relative;
    overflow:hidden;
  }
  .app::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,var(--coral),var(--moss) 55%,var(--pine));
    opacity:.85;
  }
  section{animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  [hidden]{display:none !important}

  .cover{text-align:center;padding-top:10px}
  .cover .mark{
    width:118px;height:118px;margin:6px auto 22px;border-radius:50%;
    background:linear-gradient(145deg,#8FB08F,var(--moss));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 26px rgba(107,143,113,.32);
  }
  .cover .mark svg{width:58px;height:58px}
  .cover h1{
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    font-size:34px;font-weight:700;letter-spacing:2px;color:var(--pine);
  }
  .cover .sub{
    margin-top:10px;color:var(--ink-soft);font-size:15px;letter-spacing:1px;
  }
  .cover .meta{
    margin:26px auto 0;display:inline-flex;gap:14px;
    background:var(--sand);border-radius:999px;padding:9px 18px;
    font-size:13px;color:var(--ink-soft);
  }
  .meta span{display:inline-flex;align-items:center;gap:5px}
  .btn{
    display:block;width:100%;border:none;cursor:pointer;
    font-size:17px;font-weight:600;letter-spacing:2px;
    padding:15px 0;border-radius:999px;transition:transform .15s,box-shadow .15s;
  }
  .btn-primary{background:var(--pine);color:#FDFAF3;box-shadow:0 10px 22px rgba(45,74,62,.25)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(45,74,62,.32)}
  .btn-primary:active{transform:translateY(0)}
  .btn-ghost{
    background:transparent;color:var(--ink-soft);border:1px solid var(--sand-deep);
    font-size:15px;letter-spacing:1px;margin-top:14px;
  }
  .cover .start{margin-top:34px}
  .cover .note{margin-top:16px;font-size:12px;color:var(--ink-soft);opacity:.8}

  .quiz-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .q-count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .q-count b{color:var(--coral);font-size:16px}
  .bar{flex:1;height:8px;background:var(--sand-deep);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--coral));transition:width .35s ease}
  .quiz h2{
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    font-size:23px;font-weight:700;line-height:1.5;color:var(--pine);
    margin-bottom:24px;min-height:66px;
  }
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{
    text-align:left;width:100%;border:1.5px solid var(--sand-deep);background:#fff;
    border-radius:16px;padding:14px 18px;font-size:15.5px;color:var(--ink);
    cursor:pointer;transition:border-color .15s,background .15s,transform .1s;
    font-family:inherit;line-height:1.5;
  }
  .opt:hover{border-color:var(--moss);transform:translateX(2px)}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--coral);background:#FDF1EC;font-weight:600;color:#B5523A}
  .quiz .next{margin-top:26px}

  .result{text-align:center;padding-top:8px}
  .result .label{
    display:inline-block;font-size:13px;letter-spacing:3px;color:var(--ink-soft);
    background:var(--sand);border-radius:999px;padding:7px 18px;margin-bottom:20px;
  }
  .result .pic{
    width:190px;height:190px;border-radius:50%;object-fit:cover;
    border:5px solid #fff;box-shadow:0 14px 34px rgba(45,74,62,.22);
    margin:4px auto 20px;display:block;opacity:1;
    animation:pop .45s .08s both;
  }
  @keyframes pop{from{transform:scale(.88)}to{transform:none}}
  .result .def{
    display:inline-block;font-size:15px;letter-spacing:2px;font-weight:600;
    color:#B5523A;background:#FDF1EC;border-radius:999px;padding:6px 18px;margin-bottom:14px;
  }
  .result h2{
    font-family:"Songti SC","Noto Serif SC","STSong",serif;
    font-size:30px;color:var(--pine);letter-spacing:4px;margin-bottom:14px;
  }
  .tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .tags span{
    font-size:13px;color:var(--pine);background:#EDF2EA;border:1px solid #D8E4D3;
    border-radius:999px;padding:5px 14px;letter-spacing:1px;
  }
  .result .desc{
    font-size:15px;color:var(--ink);line-height:1.9;text-align:left;
    background:var(--sand);border-radius:18px;padding:18px 20px;margin-bottom:16px;
  }
  .result .quote{
    font-size:14px;color:var(--coral);font-style:normal;font-weight:600;
    background:#FDF1EC;border-radius:14px;padding:13px 16px;margin-bottom:24px;line-height:1.7;
  }
  .result .share{
    font-size:12.5px;color:var(--ink-soft);margin-top:14px;letter-spacing:1px;
  }
  .result .share b{color:var(--moss);font-weight:600}

  @media (max-width:380px){
    .app{padding:28px 18px 24px}
    .cover h1{font-size:29px}
    .quiz h2{font-size:20px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<main class="app">

  <!-- ===== 视图：封面 ===== -->
  <section id="view-cover" class="cover">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M20 40c0-9 5-16 12-16s12 7 12 16c0 5-3 8-6 8H26c-3 0-6-3-6-8z" fill="#F5EFE4"/>
        <path d="M28 22h8v6h-8z" fill="#F5EFE4"/>
        <path d="M30 24c0-3 2-5 2-5s2 2 2 5" stroke="#E8795A" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>你在朋友里是哪只<br>动物？</h1>
    <p class="sub">8 个问题，测出你在朋友圈里的角色</p>
    <div class="meta">
      <span>约 2 分钟</span>
      <span>·</span>
      <span>6 种社交人格</span>
    </div>
    <button class="btn btn-primary start" id="btn-start">开始测试</button>
    <p class="note">结果仅供娱乐，认真你就输了</p>
  </section>

  <!-- ===== 视图：答题 ===== -->
  <section id="view-quiz" class="quiz" hidden>
    <div class="quiz-head">
      <span class="q-count"><b id="q-cur">1</b> / <span id="q-total">8</span></span>
      <div class="bar"><i id="q-bar"></i></div>
    </div>
    <h2 id="q-text"></h2>
    <div class="opts" id="q-opts"></div>
    <button class="btn btn-primary next" id="btn-next" hidden>下一题</button>
  </section>

  <!-- ===== 视图：结果 ===== -->
  <section id="view-result" class="result" hidden>
    <span class="label">你的交友模式是</span>
    <img class="pic" data-a="wolf" src="assets/animal-wolf.jpg" alt="狼人格形象" hidden>
    <img class="pic" data-a="fox" src="assets/animal-fox.jpg" alt="狐狸人格形象" hidden>
    <img class="pic" data-a="cat" src="assets/animal-cat.jpg" alt="猫人格形象" hidden>
    <img class="pic" data-a="deer" src="assets/animal-deer.jpg" alt="鹿人格形象" hidden>
    <img class="pic" data-a="lion" src="assets/animal-lion.jpg" alt="狮子人格形象" hidden>
    <img class="pic" data-a="dolphin" src="assets/animal-dolphin.jpg" alt="海豚人格形象" hidden>
    <span class="def" id="r-def"></span>
    <h2 id="r-name"></h2>
    <div class="tags" id="r-tags"></div>
    <p class="desc" id="r-desc"></p>
    <p class="quote" id="r-quote"></p>
    <button class="btn btn-primary" id="btn-retry">再测一次</button>
    <p class="share">截图你的社交人格，看看朋友眼里你是不是这样的人？<br><b>长按图片可保存</b></p>
  </section>

</main>

<script>
(function(){
  "use strict";

  var QUESTIONS = [
    { q:"朋友约你周末聚会，你第一反应？", opts:[
      { t:"走起，我来张罗局", a:"lion" },
      { t:"好啊，人多热闹最好", a:"dolphin" },
      { t:"看心情，累了就鸽", a:"cat" },
      { t:"约一两个就够，别太吵", a:"wolf" }
    ]},
    { q:"朋友向你倾诉心事，你会？", opts:[
      { t:"认真听，给足情绪价值", a:"deer" },
      { t:"边听边给建议和方案", a:"fox" },
      { t:"拉他行动起来，别光顾着难受", a:"lion" },
      { t:"陪他玩一场，转移心情", a:"dolphin" }
    ]},
    { q:"你多久发一次朋友圈？", opts:[
      { t:"基本不发，懂我的人自然懂", a:"wolf" },
      { t:"常发，分享生活记录快乐", a:"dolphin" },
      { t:"偶尔发，想发才发", a:"cat" },
      { t:"很少发自拍，发都是有内容的", a:"fox" }
    ]},
    { q:"一群朋友在群里吵起来了，你？", opts:[
      { t:"出面当和事佬，拉回正题", a:"lion" },
      { t:"看戏，不掺和", a:"cat" },
      { t:"私聊两边调解", a:"deer" },
      { t:"发个搞笑表情包缓解气氛", a:"dolphin" }
    ]},
    { q:"朋友找你借钱或求帮忙，你？", opts:[
      { t:"能帮就帮，不多想", a:"deer" },
      { t:"先评估值不值得帮", a:"fox" },
      { t:"量力而行，帮不上直说", a:"wolf" },
      { t:"拉上其他人一起帮", a:"lion" }
    ]},
    { q:"你的常联系好友是？", opts:[
      { t:"就三五个，都是过命交情", a:"wolf" },
      { t:"一大堆，各行各业都有", a:"fox" },
      { t:"家人加最好的几个朋友", a:"deer" },
      { t:"置顶的群比人多", a:"dolphin" }
    ]},
    { q:"朋友说你变了，你？", opts:[
      { t:"无所谓，我本来就这样", a:"wolf" },
      { t:"有点在意，会反思一下", a:"deer" },
      { t:"哈哈哈哈哈敷衍过去", a:"dolphin" },
      { t:"顺着话题聊聊为什么", a:"fox" }
    ]},
    { q:"你理想的友谊状态是？", opts:[
      { t:"君子之交淡如水，各自安好", a:"wolf" },
      { t:"常聚常玩，热热闹闹", a:"dolphin" },
      { t:"有事随时在，没事不打扰", a:"cat" },
      { t:"一起搞钱，一起进步", a:"fox" }
    ]}
  ];

  var ANIMALS = {
    wolf: {
      name:"狼", def:"独行侠", tags:["独立","通透","重质不重量"],
      desc:"你是朋友里的「独行侠」。你不混圈子、不凑热闹，留下的都是过命的交情。你懒得维持表面关系，但真朋友有事，你第一个到。别人觉得你冷，其实你只是把热情留给了值得的人。",
      quote:"朋友不用多，真心的几个就够。"
    },
    fox: {
      name:"狐狸", def:"人脉玩家", tags:["情商","连接","机会"],
      desc:"你是朋友圈里的「连接器」。你认识的人横跨各行各业，谁和谁该认识你心里门清。你懂得经营关系，却也不失真诚。在你眼里，朋友既是情感羁绊，也是彼此的机会网络。",
      quote:"多条朋友多条路，你正在把路走宽。"
    },
    cat: {
      name:"猫", def:"随缘型", tags:["自由","看心情","不强求"],
      desc:"你是社交里的「佛系选手」。想聚就聚，累了就消失，从不为维系关系委屈自己。你不主动也不拒绝，合得来就多聊两句，合不来就各自安好。你的朋友都懂：找你靠缘分。",
      quote:"社交的质量，由你的心情决定。"
    },
    deer: {
      name:"鹿", def:"知心朋友", tags:["温和","靠谱","治愈"],
      desc:"你是朋友圈里的「定海神针」。谁有心事都爱找你，因为你听得进、守得住、暖得到。你不张扬，却是很多人心里最依赖的那个人。你交朋友不图热闹，图的是彼此托底。",
      quote:"能被你倾听过的人，都记得你的好。"
    },
    lion: {
      name:"狮子", def:"主心骨", tags:["担当","号召力","照顾人"],
      desc:"你是朋友群里的「主心骨」。聚会你张罗，出事你出头，大家习惯性听你安排。你天生带着责任感，把朋友的事当自己的事。你的朋友圈，因为有你而有了凝聚力。",
      quote:"有你张罗，大家才聚得起来。"
    },
    dolphin: {
      name:"海豚", def:"气氛担当", tags:["热情","感染力","人缘"],
      desc:"你是朋友圈里的「快乐开关」。有你在，冷场不存在，笑点永远在线。你朋友多、人缘好，走哪都有人认。你看起来大大咧咧，其实很在乎身边每个人开不开心。",
      quote:"你一笑，朋友圈的天都亮了。"
    }
  };

  var $ = function(id){ return document.getElementById(id); };
  var views = { cover:$("view-cover"), quiz:$("view-quiz"), result:$("view-result") };
  function show(v){
    Object.keys(views).forEach(function(k){ views[k].hidden = (k !== v); });
  }

  var cur = 0, scores = {}, selected = null;
  function reset(){
    cur = 0; selected = null; scores = {};
    ["wolf","fox","cat","deer","lion","dolphin"].forEach(function(a){ scores[a] = 0; });
  }
  function renderQuestion(){
    var item = QUESTIONS[cur];
    $("q-cur").textContent = cur + 1;
    $("q-total").textContent = QUESTIONS.length;
    $("q-bar").style.width = (cur / QUESTIONS.length * 100) + "%";
    $("q-text").textContent = item.q;
    var box = $("q-opts");
    box.innerHTML = "";
    selected = null;
    $("btn-next").hidden = true;
    item.opts.forEach(function(o, i){
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = o.t;
      b.addEventListener("click", function(){
        scores[o.a] += 1;
        selected = o.a;
        var all = box.children;
        for (var j = 0; j < all.length; j++){ all[j].classList.remove("sel"); }
        b.classList.add("sel");
        $("btn-next").hidden = false;
      });
      box.appendChild(b);
    });
  }
  function next(){
    if (selected === null) return;
    cur += 1;
    if (cur < QUESTIONS.length){
      renderQuestion();
    } else {
      var win = "wolf", best = -1;
      Object.keys(scores).forEach(function(a){
        if (scores[a] > best){ best = scores[a]; win = a; }
      });
      showResult(win);
    }
  }
  function showResult(animalId){
    var a = ANIMALS[animalId];
    var pics = document.querySelectorAll(".result .pic");
    for (var p = 0; p < pics.length; p++){
      pics[p].hidden = (pics[p].getAttribute("data-a") !== animalId);
    }
    $("r-def").textContent = a.def;
    $("r-name").textContent = a.name;
    var tags = $("r-tags");
    tags.innerHTML = "";
    a.tags.forEach(function(t){
      var s = document.createElement("span");
      s.textContent = t;
      tags.appendChild(s);
    });
    $("r-desc").textContent = a.desc;
    $("r-quote").textContent = "「 " + a.quote + " 」";
    show("result");
  }

  $("btn-start").addEventListener("click", function(){
    reset();
    renderQuestion();
    show("quiz");
  });
  $("btn-next").addEventListener("click", next);
  $("btn-retry").addEventListener("click", function(){
    reset();
    renderQuestion();
    show("quiz");
  });
})();
</script>
</body>
</html>
